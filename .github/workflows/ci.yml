name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
      - "LICENSE"
      - "THIRD_PARTY.md"
      - "data/*.metainfo.xml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
      - "LICENSE"
      - "THIRD_PARTY.md"
      - "data/*.metainfo.xml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".gitignore"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install system packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake ninja-build pkgconf-pkg-config git \
            dbus-devel dbus-daemon protobuf-compiler squashfs-tools curl \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            extra-cmake-modules \
            kf6-kirigami-devel kf6-kstatusnotifieritem-devel kf6-knotifications-devel \
            kf6-ki18n-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kdbusaddons-devel \
            kf6-kio-devel kf6-kiconthemes-devel kf6-kirigami-addons

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-features

      - name: Build shell
        run: |
          cmake -S src/shell -B dist/tmp/cmake-dev -G Ninja
          cmake --build dist/tmp/cmake-dev
      - name: Shell tests
        run: ctest --test-dir dist/tmp/cmake-dev --output-on-failure

      - name: qmllint
        run: qmllint-qt6 -I /usr/lib64/qt6/qml src/shell/qml/*.qml

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the AppImage and the tarball
        run: |
          build/build-appimage.sh
          build/build-tarball.sh

      - name: Test
        run: |
          build/appimage/test-appimage.sh dist/KuickShare-*-x86_64.AppImage
          build/test-tarball.sh dist/KuickShare-*-x86_64.tar.gz

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install system packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            flatpak flatpak-builder git python3 python3-pip python3-aiohttp \
            dbus-daemon appstream ostree gnupg2 xz curl \
            xdg-desktop-portal fuse3 python3-gobject-base
          pip install --no-cache-dir tomlkit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Flatpak
        run: |
          touch /run/.containerenv
          build/flatpak/build-flatpak.sh

      - name: Smoke test
        run: |
          mkdir -p -m 700 /run/user/0
          XDG_RUNTIME_DIR=/run/user/0 dbus-run-session -- build/flatpak/test-flatpak.sh dist/KuickShare-*.flatpak
